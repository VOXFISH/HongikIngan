<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교실 로비 — 인터랙티브 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#2e2118}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1b1824;font-family:'Jua','Gowun Dodum',sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#f4ead5;user-select:none;-webkit-user-select:none}
#bg{position:absolute;left:0;top:0;z-index:0}
button{font-family:'Jua',sans-serif;color:var(--ink)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:28px;top:24px;z-index:50;display:flex;align-items:center;gap:12px;background:#2e2a3d;border:5px solid var(--ink);border-radius:44px;padding:8px 28px 8px 10px;box-shadow:0 7px 0 rgba(0,0,0,.35)}
#hud .coin{width:54px;height:54px}
#hud .lbl{font-size:18px;color:#bdb3d6;margin-right:2px}
#coinNum{font-size:46px;color:#fff1c9;min-width:150px;line-height:1}
.delta{position:absolute;left:100%;top:6px;margin-left:14px;font-size:36px;white-space:nowrap;text-shadow:0 3px 0 var(--ink);pointer-events:none}
.delta.minus{color:#ff8a7a}.delta.plus{color:#9df5a8}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#resetBtn{position:absolute;right:28px;top:28px;z-index:50;display:flex;align-items:center;gap:8px;font-size:22px;background:#fffaf0;border:4px solid var(--ink);border-radius:30px;padding:8px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
#resetBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

/* ---------- Locker / shop ---------- */
#locker{position:absolute;left:221px;top:385px;width:836px;height:358px;z-index:5;background:#1f5a38;border:6px solid #143a25;border-radius:8px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(3,1fr);gap:6px;padding:6px;box-shadow:0 8px 0 rgba(46,33,24,.18)}
#locker::before{content:'';position:absolute;left:-14px;right:-14px;top:-26px;height:20px;background:#2f7d4f;border:5px solid #143a25;border-radius:6px}
#locker.rattle{animation:rattle .3s .05s}
@keyframes rattle{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.cell{position:relative;perspective:420px;border-radius:5px}
.cell .inside{position:absolute;inset:0;border-radius:5px;background:linear-gradient(#0f3020,#184a30);box-shadow:inset 0 8px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell .inside::after{content:'';position:absolute;left:4px;right:4px;bottom:8px;height:5px;border-radius:3px;background:#2a6a44}
.door{position:absolute;inset:0;z-index:2;border-radius:5px;background:linear-gradient(180deg,#48b374,#2f8f58);border:3px solid #17502f;transform-origin:left center;transition:transform .4s cubic-bezier(.55,0,.25,1)}
.door .vents{position:absolute;left:20%;right:20%;top:13%;height:24%;border-radius:3px;background:repeating-linear-gradient(180deg,#1d6a3f 0 4px,transparent 4px 9px)}
.door .handle{position:absolute;right:10%;top:50%;width:8px;height:22px;background:#d9e6de;border:2px solid #17502f;border-radius:4px}
.door .plate{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);background:#f1f7f3;border:2px solid #17502f;border-radius:4px;font-size:13px;padding:0 6px;color:#17502f;line-height:1.3}
.cell.open .door{transform:rotateY(-78deg)}
.cell.open .inside{padding-left:22px}
.item{position:relative;z-index:1;width:58px;height:58px;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.item:hover{transform:translateY(-5px) scale(1.08)}
.price{position:relative;z-index:1;display:flex;align-items:center;gap:3px;background:#fff3c4;border:2px solid var(--ink);border-radius:10px;padding:0 7px 0 3px;font-size:17px;line-height:1.25}
.price svg{width:16px;height:16px}
.sold{position:relative;z-index:1;font-size:16px;color:rgba(255,255,255,.35)}
.rr{position:absolute;inset:5px;z-index:3;border:4px solid var(--ink);border-radius:14px;background:#ffd166;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rr .ic{width:34px;height:34px;transition:transform .3s}
.rr:hover .ic{transform:rotate(-120deg)}
.rr .t{font-size:21px;margin-top:3px}
.rr .c{font-size:16px;margin-top:4px;display:flex;align-items:center;gap:3px}
.rr .c svg{width:16px;height:16px}
.rr:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

#relicShelf{position:absolute;left:227px;top:296px;width:824px;height:71px;z-index:6}
.relic{position:absolute;bottom:0;width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.relic.new{animation:land .35s}
@keyframes land{0%{transform:scale(1.25,.8)}60%{transform:scale(.92,1.08)}100%{transform:none}}
.rel-empty{position:absolute;left:12px;bottom:16px;font-family:'Gowun Dodum';font-size:20px;color:rgba(46,33,24,.45)}

/* ---------- Bookshelf synergy ---------- */
#shelfStacks{position:absolute;left:1186px;top:150px;width:440px;height:245px;z-index:6;display:flex;align-items:flex-end;justify-content:center;gap:8px;pointer-events:none}
.stack{width:64px;display:flex;flex-direction:column;align-items:center}
.stag{background:#fffaf0;border:3px solid var(--ink);border-radius:10px;font-size:15px;line-height:1.1;padding:3px 5px;margin-bottom:4px;text-align:center;white-space:nowrap;box-shadow:0 3px 0 rgba(46,33,24,.3)}
.stag small{display:block;font-size:12px;color:#7a6a58}
.stag.club{border-top:6px solid var(--c)}.stag.pers{border-top:6px solid var(--c)}
.book{width:62px;height:24px;background:var(--c);border:3px solid var(--ink);border-radius:4px;margin-top:-3px;position:relative;transform:translateX(var(--o)) rotate(var(--r))}
.book.club::before{content:'';position:absolute;left:9px;top:2px;bottom:2px;width:6px;background:rgba(255,255,255,.65);border-radius:2px}
.book.club::after{content:'';position:absolute;right:9px;top:2px;bottom:2px;width:6px;background:rgba(255,255,255,.65);border-radius:2px}
.book.pers::before{content:'';position:absolute;left:14px;right:14px;top:5px;height:4px;background:rgba(255,255,255,.55);border-radius:2px}
.book.new{animation:drop .45s backwards}
@keyframes drop{0%{transform:translate(var(--o),-70px) rotate(-12deg);opacity:0}70%{transform:translate(var(--o),4px) rotate(var(--r));opacity:1}100%{transform:translateX(var(--o)) rotate(var(--r))}}
.syn-empty{align-self:flex-end;margin-bottom:12px;font-family:'Gowun Dodum';font-size:18px;line-height:1.4;text-align:center;color:rgba(46,33,24,.5);background:rgba(255,250,240,.6);border:2px dashed rgba(46,33,24,.3);border-radius:12px;padding:8px 14px}

/* ---------- Desks ---------- */
.desk{position:absolute;width:277px;height:277px;pointer-events:none}
.desk svg.part{position:absolute;left:0;top:0;width:277px;height:277px}
.seat{position:absolute;left:83px;top:8px;width:111px;height:155px}
.seat svg{width:100%;height:100%;transform-origin:50% 100%}
.seat.has{pointer-events:auto;cursor:pointer}
.seat.has:hover{filter:brightness(1.05) drop-shadow(0 0 6px #fff)}
.seat.selected{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px #ffd166)}
.seat.arrive svg{animation:squash .45s}
@keyframes squash{0%{transform:scale(.2,0);filter:brightness(3)}55%{transform:scale(1.08,1.06);filter:brightness(1.6)}100%{transform:none}}
.seat.leaving{transition:transform .45s,opacity .45s;transform:translateY(-60px) scale(.7);opacity:0}
.replacing .seat.has{animation:pulse .9s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px #ff5d5d)}}
.seat.study{animation:glow 1.1s}
@keyframes glow{30%{filter:brightness(1.3) drop-shadow(0 0 18px #7fe3ff)}}

#labels{position:absolute;inset:0;z-index:40;pointer-events:none}
.hlabel{position:absolute;transform:translate(-50%,-100%);display:flex;gap:4px;background:#fffaf0;border:3px solid var(--ink);border-radius:14px;padding:3px 5px;font-size:16px;line-height:1.2;white-space:nowrap;box-shadow:0 4px 0 rgba(46,33,24,.3)}
.hlabel::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.chip{padding:1px 7px;border-radius:9px;background:var(--c,#eee)}
.chip.g1{background:#c8f0cf}.chip.g2{background:#cfe6ff}.chip.g3{background:#f0d9ff}

#actionMenu{position:absolute;z-index:45;display:none;flex-direction:column;gap:10px}
#actionMenu.show{display:flex;animation:pop .18s}
.mbtn{font-size:24px;width:204px;white-space:nowrap;padding:10px 14px;border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.mbtn small{font-size:16px;display:flex;align-items:center;gap:3px}
.mbtn small svg{width:17px;height:17px}
.mbtn.send{background:#ffe1d6}.mbtn.study{background:#d6f0ff}
.mbtn:hover{filter:brightness(1.04)}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}

/* ---------- Polaroid board ---------- */
#boardPics{position:absolute;left:595px;top:35px;width:446px;height:292px;z-index:4;pointer-events:none}
.pola{position:absolute;left:0;top:0;width:84px;height:100px;background:#fffdf7;border:3px solid var(--ink);padding:5px 5px 0;box-shadow:0 4px 0 rgba(46,33,24,.25)}
.pola .ph{width:100%;height:64px;background:var(--bg);border:2px solid rgba(46,33,24,.2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pola .ph svg{width:62px;height:87px;margin-bottom:-26px;flex:none}
.pola .cap{font-size:13px;text-align:center;line-height:22px;white-space:nowrap}
.pola .pin{position:absolute;left:50%;top:-9px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--pin,#e4572e);border:2.5px solid var(--ink);display:none}
#boardPics .pola .pin{display:block}
#boardPics .pola.pinned{animation:stick .35s}
#boardPics .pola.pinned .pin{animation:pinpop .3s .2s backwards}
@keyframes stick{0%{scale:1.15}60%{scale:.96}100%{scale:1}}
@keyframes pinpop{0%{transform:translateY(-14px) scale(1.6);opacity:0}100%{transform:none;opacity:1}}
.board-empty{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:'Gowun Dodum';font-size:19px;line-height:1.5;color:rgba(70,40,15,.6)}
.mini .hold{position:absolute;left:46px;top:44px;width:84px;height:100px;transform:rotate(10deg) scale(.4);transform-origin:0 0;pointer-events:none}
.mini .hold .pola{box-shadow:none}
.fly.pola{transform-origin:0 0}

/* ---------- Battle ---------- */
#turnBadge{position:absolute;left:1484px;top:920px;width:102px;height:102px;z-index:51;border-radius:50%;background:#2e2a3d;border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff1c9;line-height:1;pointer-events:none}
#turnBadge small{font-size:16px;color:#bdb3d6;margin-bottom:5px}
#turnBadge b{font-weight:normal;font-size:48px}
#turnBadge.bump{animation:pop .45s}
#battle{position:absolute;inset:0;z-index:90;display:none;overflow:hidden;background:#7aa7ff}
#battle.show{display:block}
#battle svg.layer{position:absolute;left:0;top:0}
#monster{position:absolute;left:1344px;top:190px;width:412px;height:1000px;transform-origin:50% 100%}
#monster .mbody{width:100%;height:100%;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.012,1.02)}}
#monster.hit .mbody{animation:mhit .55s}
@keyframes mhit{0%,100%{transform:none;filter:none}12%{transform:translateX(16px);filter:brightness(2.4) saturate(.2)}32%{transform:translateX(-12px);filter:brightness(1.4) hue-rotate(-50deg)}55%{transform:translateX(7px)}78%{transform:translateX(-3px)}}
#hpWrap{position:absolute;left:1346px;top:84px;width:410px;z-index:8}
#hpWrap .nm{display:flex;justify-content:space-between;align-items:flex-end;font-size:28px;color:#fff;text-shadow:0 3px 0 var(--ink);margin-bottom:6px}
#hpWrap .nm span{font-size:24px}
#hpBar{height:36px;background:#3b2f4a;border:5px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);position:relative}
#hpGhost,#hpFill{position:absolute;left:0;top:0;bottom:0}
#hpGhost{background:#fff3c4;transition:width 1s .45s ease-out}
#hpFill{background:linear-gradient(#ff8a7a,#e4412f);transition:width .45s ease-out}
#bInfo{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:8;text-align:center;white-space:nowrap}
#bInfo .turn{font-size:46px;color:#fff;text-shadow:0 4px 0 var(--ink)}
#bInfo .note{margin-top:8px;line-height:1.5;font-family:'Gowun Dodum';font-size:19px;background:rgba(255,250,240,.94);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;display:inline-block}
#bInfo .note b{font-family:'Jua';font-weight:normal;color:#d9480f}
#bMsg{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;font-size:34px;background:#2e2a3d;color:#fff6e0;border:5px solid var(--ink);border-radius:30px;padding:12px 36px;box-shadow:0 6px 0 rgba(0,0,0,.35);white-space:nowrap;transition:opacity .2s}
#bMsg:empty{opacity:0}
.fstu{position:absolute;left:0;top:0;width:120px;height:150px;transform-origin:0 0;z-index:6}
.fstu .fb{width:100%;height:100%;animation:float 2.2s ease-in-out infinite}
.fstu .fb svg{width:100%;height:100%;transition:filter .2s}
@keyframes float{50%{transform:translateY(-12px)}}
.fstu .aura{position:absolute;left:4px;right:4px;bottom:-16px;height:28px;border-radius:50%;background:radial-gradient(rgba(150,240,255,.95),rgba(150,240,255,0) 70%)}
.fstu.charge .fb svg{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px #6fe9ff)}
.fstu .dmg{position:absolute;left:50%;top:100%;margin-top:16px;transform:translateX(-50%);font-size:16px;background:#fffaf0;border:3px solid var(--ink);border-radius:10px;padding:1px 8px;white-space:nowrap}
#orb{position:absolute;left:270px;top:298px;width:170px;height:170px;border-radius:50%;z-index:7;background:radial-gradient(circle at 40% 35%,#fff 0 18%,#c8faff 34%,#62e4ff 62%,#2fb8f0 80%);box-shadow:0 0 40px 14px rgba(120,235,255,.8),0 0 120px 46px rgba(120,235,255,.35);border:4px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#orb span{font-size:44px;color:var(--ink);text-shadow:0 0 8px #fff}
#orb.live{animation:orbPulse .5s ease-in-out infinite}
@keyframes orbPulse{50%{box-shadow:0 0 60px 22px rgba(160,245,255,.95),0 0 160px 60px rgba(120,235,255,.45)}}
#beam{position:absolute;left:420px;top:356px;width:950px;height:68px;z-index:6;transform-origin:0 50%;transform:scaleX(0);opacity:0;border-radius:34px;background:linear-gradient(#5fe3ff,#fff 33%,#fff 67%,#5fe3ff);box-shadow:0 0 30px 12px rgba(120,235,255,.9),0 0 90px 34px rgba(120,235,255,.45)}
#beam.on{animation:beamFlick .09s linear infinite}
@keyframes beamFlick{50%{filter:brightness(1.25)}}
.spark{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 10px 5px #7cecff;z-index:7;pointer-events:none}
#impact{position:absolute;left:1260px;top:270px;width:240px;height:240px;border-radius:50%;z-index:7;background:radial-gradient(#fff 0 22%,rgba(255,240,150,.95) 40%,rgba(255,160,70,0) 70%);transform:scale(0);opacity:0;pointer-events:none}
.bigdmg{position:absolute;z-index:9;font-size:120px;line-height:1;color:#ffd84a;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink);transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
.bfloat{position:absolute;z-index:9;font-size:30px;color:#fffaf0;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none}
.puff{position:absolute;z-index:7;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(240,235,250,.95),rgba(240,235,250,0) 70%);pointer-events:none}
#sweep{position:absolute;left:-340px;top:-260px;width:2600px;height:1600px;z-index:96;display:none;pointer-events:none}
#sweep .band{width:100%;height:100%;transform:skewX(-15deg);background:repeating-linear-gradient(90deg,transparent 0 150px,rgba(255,255,255,.16) 150px 176px),linear-gradient(90deg,var(--ink) 0 46px,var(--c1) 46px 130px,var(--c2) 130px calc(100% - 130px),var(--c1) calc(100% - 130px) calc(100% - 46px),var(--ink) calc(100% - 46px));display:flex;align-items:center;justify-content:center}
#sweep .txt{transform:skewX(15deg) rotate(-6deg);font-size:280px;line-height:1;color:#fffaf0;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 20px 0 var(--ink);white-space:nowrap}
.panel.result{width:780px;padding:40px 40px 36px}
.panel.result .rtitle{font-size:88px;line-height:1.1;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
.panel.result.win{background:linear-gradient(#fff6d2,#ffe08a)}
.panel.result.win .rtitle{color:#ffcf3a}
.panel.result.lose{background:linear-gradient(#efe9f7,#cfc3e6)}
.panel.result.lose .rtitle{color:#8e7bb8}
.panel.result .rsub{font-family:'Gowun Dodum';font-size:26px;margin-top:14px;text-align:center;line-height:1.5}
.panel.result .rart{height:150px;margin-top:16px;display:flex;align-items:flex-end;gap:6px}
.panel.result .rart svg{width:90px;height:100px}

.panel.result.wide{width:860px;padding:34px 44px 32px}
.panel.result .rart{height:104px;margin-top:10px}
.panel.result .rart svg{width:70px;height:98px}
.rstats{display:flex;gap:14px;margin-top:14px}
.rs{background:#fffaf0;border:3px solid var(--ink);border-radius:16px;padding:8px 20px;text-align:center;min-width:150px}
.rs b{display:block;font-weight:normal;font-family:'Gowun Dodum';font-size:16px;color:#8a7a66}
.rs span{font-size:30px}
.rewards{width:100%;margin-top:18px;background:#fffaf0;border:4px solid var(--ink);border-radius:20px;padding:10px 24px 14px}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:26px;padding:8px 0;border-bottom:2px dashed #e2d6bf}
.rw small{font-family:'Gowun Dodum';font-size:16px;color:#8a7a66;margin-left:8px}
.rw em{font-style:normal;display:flex;align-items:center;gap:6px;color:#2f8f58}
.rw em svg{width:26px;height:26px}
.rw.total{font-size:32px;border-bottom:none}
.rw.total em{color:#d9480f}
.rbal{text-align:right;font-family:'Gowun Dodum';font-size:19px;color:#7a6a58}
.rbal b{font-family:'Jua';font-weight:normal;font-size:24px;color:var(--ink)}
.btn.big{font-size:34px;padding:14px 44px}
.dcost{margin-top:12px;display:flex;align-items:center;gap:6px;font-size:30px;background:#2e2a3d;color:#fff1c9;border:3px solid var(--ink);border-radius:16px;padding:4px 18px 4px 8px}
.dcost svg{width:30px;height:30px}
.dcost.short{background:#7a6f8a;color:#ffb3a8}
.dcost.short::after{content:'코인 부족';font-size:15px;margin-left:4px}
.deck .ddesc{margin-top:auto}
#synPanel{position:absolute;left:490px;top:445px;width:360px;z-index:8;background:rgba(255,250,240,.96);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(46,33,24,.4);padding:10px 16px 12px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
#synPanel.show{opacity:1;transform:none}
#synPanel .sph{font-size:22px;margin-bottom:4px}
#synPanel .spr{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:4px 0;border-top:2px dashed #e2d6bf}
#synPanel .spr i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
#synPanel .spr small{font-family:'Gowun Dodum';font-size:14px;color:#8a7a66}

<script>
(()=>{
const W=1920,H=1080,INK='#2e2118';
const $=id=>document.getElementById(id);
const stage=$('stage');
let SCALE=1;
function fit(){SCALE=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*SCALE)/2}px,${(innerHeight-H*SCALE)/2}px) scale(${SCALE})`;}
addEventListener('resize',fit);fit();

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>n.toLocaleString('ko-KR');

/* ===== constants ===== */
const START_COINS=200, KILL_BASE=500, INTEREST_PER=100, INTEREST_GAIN=10, REROLL=50, STUDY=300, REFUND={1:100,2:150,3:200}, MAXREL=11;
const CLUB=['#ff9eb1','#ffb35c','#ffdf5e','#7fd68e','#73c4ff','#b49cff'];
const CLUB_N=['운동부','천문부','선도부','미술부','연극부','사진부'];
const PERS_N=['리더','분위기메이커','반항아','사랑꾼','독설가','귀염둥이'];
const PERS=['#e4572e','#3d5a80','#e9a40f','#2a9d8f','#9c6644','#8e5572'];
const DESK=[{x:841,y:579},{x:1147,y:581},{x:1452,y:581},{x:727,y:715},{x:1045,y:715},{x:1352,y:717}];
const SEAT={x:86,y:28,w:105};
const PIG_HOME={x:118,y:772}, QX=330, QY=945, MINI_W=76, DOOR_SPAWN={x:34,y:880,sc:.55,op:0};
const RELICS=[{k:'gem',n:'반짝 보석'},{k:'potion',n:'수상한 물약'},{k:'ring',n:'옛 반지'},{k:'orb',n:'수정 구슬'},{k:'star',n:'별 배지'},{k:'hour',n:'모래시계'},{k:'crown',n:'작은 왕관'},{k:'scroll',n:'낡은 두루마리'}];
const RCOL=['#ff6b8b','#5ec8ff','#ffd04d','#8be08b','#c39bff','#ff9f5a'];
const PRICES=[120,150,200,250,300,400,500];
const DECKS=[
 {k:'d3',name:'3개',n:3,cost:100,desc:'펫 3마리가<br>학생 후보를 데려와요'},
 {k:'d5',name:'5개',n:5,cost:150,desc:'펫 5마리가<br>학생 후보를 데려와요'},
 {k:'best5',name:'최고5개',n:5,cost:300,desc:'펫 5마리가<br>학생 후보를 데려와요'},
 {k:'syn',name:'시너지',n:3,cost:180,desc:'지금 앉은 학생과<br>부활동·성격이 겹치는 후보',bias:true},
];

/* ===== icons ===== */
const COIN=`<svg viewBox="0 0 40 40" width="100%" height="100%"><circle cx="20" cy="20" r="17" fill="#ffc83d" stroke="${INK}" stroke-width="3.5"/><circle cx="20" cy="20" r="11" fill="none" stroke="#e09a1b" stroke-width="3"/><path d="M20 12.5 L22.2 17.6 L27.6 17.9 L23.4 21.3 L24.8 26.6 L20 23.6 L15.2 26.6 L16.6 21.3 L12.4 17.9 L17.8 17.6Z" fill="#fff3c4"/></svg>`;
const RR_IC=`<svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M20 3.5v5.5h-5.5" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
function relicSVG(r){
 const c=r.c,k=`stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"`;let g='';
 switch(r.k){
 case 'gem':g=`<path d="M32 6 L54 24 L32 58 L10 24 Z" fill="${c}" ${k}/><path d="M10 24 L54 24 M22 24 L32 6 L42 24 L32 58 L22 24" fill="none" stroke="${INK}" stroke-width="2" opacity=".45"/><path d="M19 21 L29 11" stroke="#fff" stroke-width="3" opacity=".75" stroke-linecap="round"/>`;break;
 case 'potion':g=`<path d="M27 14 L37 14 L37 26 Q52 32 52 42 A20 17 0 0 1 12 42 Q12 32 27 26 Z" fill="#eef6ff" ${k}/><path d="M15.5 42 Q32 35 48.5 42 A17 13 0 0 1 15.5 42 Z" fill="${c}"/><rect x="24" y="6" width="16" height="9" rx="2" fill="#b07a4c" ${k}/><circle cx="24" cy="36" r="3" fill="#fff" opacity=".85"/>`;break;
 case 'ring':g=`<circle cx="32" cy="40" r="16" fill="none" stroke="${INK}" stroke-width="11"/><circle cx="32" cy="40" r="16" fill="none" stroke="#f2c14e" stroke-width="5"/><path d="M32 8 L43 19 L32 30 L21 19 Z" fill="${c}" ${k}/>`;break;
 case 'orb':g=`<path d="M17 57 L47 57 L42 46 L22 46 Z" fill="#8a5a3b" ${k}/><circle cx="32" cy="28" r="20" fill="${c}" ${k}/><ellipse cx="25" cy="20" rx="6" ry="4" fill="#fff" opacity=".75" transform="rotate(-30 25 20)"/>`;break;
 case 'star':g=`<polygon points="${starPts(32,34,27,12)}" fill="${c}" ${k}/><circle cx="32" cy="35" r="5" fill="#fff" opacity=".6"/>`;break;
 case 'hour':g=`<path d="M19 13 L45 13 L34 32 L45 51 L19 51 L30 32 Z" fill="#eef6ff" ${k}/><path d="M23.5 46 L40.5 46 L44 50 L20 50 Z M25 16 L39 16 L32 26 Z" fill="${c}"/><rect x="13" y="6" width="38" height="8" rx="2" fill="#8a5a3b" ${k}/><rect x="13" y="50" width="38" height="8" rx="2" fill="#8a5a3b" ${k}/>`;break;
 case 'crown':g=`<path d="M10 46 L8 18 L22 30 L32 11 L42 30 L56 18 L54 46 Z" fill="#f2c14e" ${k}/><rect x="9" y="45" width="46" height="10" rx="2" fill="#e0a92e" ${k}/><circle cx="32" cy="35" r="5.5" fill="${c}" ${k}/>`;break;
 case 'scroll':g=`<rect x="14" y="12" width="36" height="40" fill="#f3e2b3" ${k}/><rect x="10" y="7" width="44" height="10" rx="5" fill="#d9bf86" ${k}/><rect x="10" y="47" width="44" height="10" rx="5" fill="#d9bf86" ${k}/><path d="M20 25 H44 M20 32 H40 M20 39 H34" stroke="#a88b55" stroke-width="2.5"/><circle cx="43" cy="40" r="6" fill="${c}" ${k}/>`;break;
 }
 return `<svg viewBox="0 0 64 64" width="100%" height="100%">${g}</svg>`;
}

/* ===== student sphere ===== */
function face(p){

let doorF=0;
function drawDoor(){
 const f=doorF;
 $('doorPanel').setAttribute('points',quad(f,1,0,1));
 const a=Math.min(1,f+.2),b=Math.min(1,f+.8),w=$('doorWin');
 if(b-a>.01){w.setAttribute('points',quad(a,b,.09,.4));w.style.display='';}else w.style.display='none';
 const h=f+.1,kn=$('doorKnob');
 if(h<.95){kn.setAttribute('points',quad(h,h+.07,.5,.57));kn.style.display='';}else kn.style.display='none';
}
let doorAnim=0;
function doorTo(t,dur){
 const id=++doorAnim;
 return new Promise(res=>{const s=doorF,st=performance.now();
  function step(n){if(id!==doorAnim)return res();const k=Math.min(1,(n-st)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;doorF=s+(t-s)*e;drawDoor();k<1?requestAnimationFrame(step):res();}
  requestAnimationFrame(step);});
}

/* ===== motion helpers ===== */
function setPos(el,x,y,sc=1,op=1){el._p={x,y,sc,op};el.style.transform=`translate(${x}px,${y}px) scale(${sc})`;el.style.opacity=op;}
const tf=p=>`translate(${p.x}px,${p.y}px) scale(${p.sc})`;
function tween(el,to,dur=600,{hop=0,easing='ease-in-out'}={}){
 const f=el._p||{x:0,y:0,sc:1,op:1},t={...f,...to},kf=[{transform:tf(f),opacity:f.op}];
 if(hop){const n=Math.max(2,Math.round(dur/170))*2;for(let i=1;i<n;i++){const q=i/n,p={x:f.x+(t.x-f.x)*q,y:f.y+(t.y-f.y)*q-(i%2?hop:0),sc:f.sc+(t.sc-f.sc)*q};kf.push({transform:tf(p),opacity:f.op+(t.op-f.op)*q,offset:q});}}
 kf.push({transform:tf(t),opacity:t.op});
 const a=el.animate(kf,{duration:dur,easing:hop?'linear':easing,fill:'forwards'});
 return a.finished.then(()=>{setPos(el,t.x,t.y,t.sc,t.op);a.cancel();}).catch(()=>{});
}
function stageRect(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/SCALE,y:(r.top-s.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE};}

  <div class="rsub">괴수 ${BT.boss}을(를) ${BT.turns}턴 안에 잡지 못했어요<br>남은 괴수 HP ${fmt(BT.hp)}</div>
  <div class="pbtns"><button class="btn primary" id="rhome">처음으로</button></div></div>`);
  $('rhome').onclick=()=>{closeModal();sweep('처음으로','#7fd68e','#c8f0cf',()=>{hideBattle();doReset();}).then(()=>{S.busy=false;idleHint();});};
  return;
 }
 const have=S.coins,interest=Math.floor(have/INTEREST_PER)*INTEREST_GAIN,total=KILL_BASE+interest;
 showModal(`<div class="panel result win wide"><div class="rtitle">괴수 ${BT.boss} 처치!</div>
 <div class="rart">${team.map(magicalSVG).join('')}</div>
 <div class="rstats">
  <div class="rs"><b>사용한 턴</b><span>${BT.turn}턴</span></div>
  <div class="rs"><b>남은 턴</b><span>${BT.turnsLeft} / ${BT.turns}</span></div>
  <div class="rs"><b>출동 학생</b><span>${team.length}명</span></div>
 </div>
 <div class="rewards">
  <div class="rw"><span>처치 보상</span><em>${COIN}+${fmt(KILL_BASE)}</em></div>
  <div class="rw"><span>이자 <small>보유 ${fmt(have)}코인 · ${INTEREST_PER}코인당 +${INTEREST_GAIN}</small></span><em>${COIN}+${fmt(interest)}</em></div>
  <div class="rw total"><span>총 획득</span><em>${COIN}+${fmt(total)}</em></div>
  <div class="rbal">보유 코인 ${fmt(have)} → <b>${fmt(have+total)}</b></div>
 </div>
 <div class="pbtns"><button class="btn primary big" id="rnext">다음 괴수를 향해 →</button></div></div>`);
 $('rnext').onclick=()=>{
  closeModal();
  sweep('다음 괴수로!','#ffd166','#ffb35c',()=>{
   hideBattle();addCoins(total);
   BT.boss++;BT.max=bossHp(BT.boss);BT.hp=BT.max;BT.turn=0;BT.turnsLeft=BT.turns;renderTurns();
   S.packBought=false;
  }).then(()=>{S.busy=false;idleHint();toast(`괴수 ${BT.boss}이(가) 나타났어요! 다시 ${BT.turns}턴 · 코인 +${fmt(total)}`);});
 };
}
/* ===== henshin: rise, transform, break window ===== */
function restoreClassroom(){
 seatEls.forEach(se=>se.style.visibility='');$('labels').style.opacity='';$('flyLayer').innerHTML='';
 $('winIntact').style.display='';$('winBroken').style.display='none';
}
function bigCaption(text){
 const d=document.createElement('div');d.className='bigcap';d.textContent=text;stage.appendChild(d);
 return d.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(-8deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15) rotate(-4deg)',opacity:1,offset:.25},{transform:'translate(-50%,-50%) scale(1) rotate(-4deg)',opacity:1,offset:.75},{transform:'translate(-50%,-60%) scale(1.05) rotate(-4deg)',opacity:0}],{duration:1300,easing:'ease-out'}).finished.then(()=>d.remove());
}
function starBurst(cx,cy,n=10,r=110){
 for(let k=0;k<n;k++){const a=k/n*Math.PI*2+Math.random()*.4,d=document.createElement('div');d.className='tstar';d.style.left=cx+'px';d.style.top=cy+'px';d.style.background=pick(['#ffd84a','#ff9ec4','#9fe8ff','#fff']);$('fx').appendChild(d);
  d.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(0)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r}px)) scale(1) rotate(180deg)`,opacity:1,offset:.6},{transform:`translate(calc(-50% + ${Math.cos(a)*r*1.3}px),calc(-50% + ${Math.sin(a)*r*1.3}px)) scale(.3) rotate(300deg)`,opacity:0}],{duration:900,easing:'ease-out'}).finished.then(()=>d.remove());}
}
function shatter(){
 $('winIntact').style.display='none';$('winBroken').style.display='';
 stage.animate([{transform:stage.style.transform},{transform:stage.style.transform+' translate(-10px,6px)'},{transform:stage.style.transform+' translate(8px,-5px)'},{transform:stage.style.transform+' translate(-4px,3px)'},{transform:stage.style.transform}],{duration:320});
 for(let k=0;k<16;k++){const d=document.createElement('div');d.className='shard';const w=rand(18,46),h=rand(18,46);d.style.width=w+'px';d.style.height=h+'px';
  const x0=1830+rand(0,90),y0=rand(200,600);d.style.left=x0+'px';d.style.top=y0+'px';$('fx').appendChild(d);
  const dx=rand(-260,140),dy=rand(-40,420),rot=rand(-540,540);
  d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],{duration:rand(700,1100),easing:'cubic-bezier(.2,.6,.4,1)'}).finished.then(()=>d.remove());}
 const fl=$('flash');fl.style.background='#fff';fl.animate([{opacity:.0},{opacity:.6,offset:.15},{opacity:0}],{duration:380});
}
async function henshin(){
 const idxs=S.desks.map((st,i)=>st?i:-1).filter(i=>i>=0);
 $('labels').style.opacity='0';
 const fls=idxs.map(i=>{const d=DESK[i],f=document.createElement('div');f.className='flyst';f.innerHTML=`<div class="fsv">${studentSVG(S.desks[i])}</div>`;$('flyLayer').appendChild(f);setPos(f,d.x+83,d.y+8);seatEls[i].style.visibility='hidden';f._i=i;return f;});
 // 1. rise
 await Promise.all(fls.map((f,k)=>sleep(k*90).then(()=>tween(f,{y:f._p.y-170-(k%2)*30},700,{easing:'cubic-bezier(.3,1.3,.5,1)'}))));
 fls.forEach(f=>f.classList.add('hover'));
 await sleep(250);
 // 2. transform
 fls.forEach(f=>f.classList.add('glow'));
 fls.forEach(f=>starBurst(f._p.x+55,f._p.y+78,8,90));
 await sleep(650);
 const fl=$('flash');fl.style.background='radial-gradient(#fff,#ffe6f3)';
 await fl.animate([{opacity:0},{opacity:1}],{duration:180,fill:'forwards'}).finished;
 fls.forEach(f=>{f.querySelector('.fsv').innerHTML=magicalSVG(S.desks[f._i]);});
 bigCaption('변신!');
 fl.animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'});
 fls.forEach(f=>starBurst(f._p.x+55,f._p.y+78,12,130));
 fls.forEach(f=>{f.classList.remove('glow');f.classList.add('pop');});
 await sleep(1150);
 // 3. fly out through the window
 let broke=false;
 await Promise.all(fls.map((f,k)=>sleep(k*140).then(async()=>{
  await tween(f,{x:1700,y:260+(k%3)*90,sc:.85},520,{easing:'ease-in'});
  if(!broke){broke=true;shatter();}
  await tween(f,{x:2080,y:200+(k%3)*80,sc:.7,op:0},380,{easing:'ease-in'});
 })));
 await sleep(250);
}
async function sortie(){
 if(S.busy||S.rerolling||S.replacing)return;
 const team=S.desks.filter(Boolean);
 if(!team.length){toast('책상에 앉은 학생이 있어야 출동할 수 있어요');return;}
 if(BT.turnsLeft<=0)return;
 closeMenu();S.busy=true;bub.classList.add('hide');
 BT.turn++;BT.turnsLeft--;renderTurns();
 await henshin();
 await sweep('출동!','#ffd166','#ff6b4a',()=>showBattle(team));
 await battleTurn(team);
 if(BT.hp<=0){await monsterDown();setMsg('');showResult(true);return;}
 if(BT.turnsLeft<=0){setMsg('괴수를 쓰러뜨리지 못했어요…');await sleep(1100);setMsg('');showResult(false);return;}
 setMsg(`괴수가 아직 버티고 있어요! 남은 HP ${fmt(BT.hp)} — 교실로 돌아갑니다`);
 await sleep(1500);
 await sweep('교실로 귀환','#73c4ff','#b49cff',()=>{hideBattle();});
 S.packBought=false;
 toast(`남은 턴 ${BT.turnsLeft}번 · 괴수 HP ${fmt(BT.hp)} · 팩을 다시 살 수 있어요`);
 S.busy=false;idleHint();
}

/* ===== misc ===== */
$('sortie').innerHTML='출동';
$('sortie').onclick=sortie;
$('resetBtn').innerHTML=`<svg viewBox="0 0 24 24" width="22" height="22"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M20 3.5v5.5h-5.5" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>처음부터`;
function seatStarters(){
 S.desks=S.desks.map(()=>{const st=genStudent(false);st.grade=1;return st;});
 S.desks.forEach((_,i)=>renderDesk(i));refreshClass();
}
function doReset(){
 closeMenu();closeModal();
 S.coins=START_COINS;renderCoins();S.relics=[];renderRelics();
 prevSyn={};seatStarters();
 genShop();renderShop();S.pics=0;renderBoardEmpty();
 BT.max=bossHp(1);BT.hp=BT.max;BT.turn=0;BT.turnsLeft=BT.turns;BT.boss=1;renderTurns();
 S.packBought=false;idleHint();
}
$('resetBtn').onclick=()=>{
 if(S.busy||S.rerolling){toast('진행 중인 연출이 끝난 뒤에 눌러주세요');return;}
 doReset();toast('처음 상태로 되돌렸어요');
};
function tickClock(){const d=new Date(),h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();
 $('ch').setAttribute('transform',`rotate(${h*30+m*.5} 379 165)`);$('cm').setAttribute('transform',`rotate(${m*6+s*.1} 379 165)`);$('cs').setAttribute('transform',`rotate(${s*6} 379 165)`);}

/* ===== init ===== */
document.querySelector('#hud .coin').innerHTML=COIN;
pigeon.querySelector('.pg').innerHTML=PIGEON_SVG;
buildBG();drawDoor();buildLocker();buildDesks();buildBattle();
genShop();renderShop();renderRelics();seatStarters();renderBoardEmpty();
setPos(pigeon,PIG_HOME.x,PIG_HOME.y);
tickClock();setInterval(tickClock,1000);
window.__S=S;window.__BT=BT;
})();
</script>
